<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Valmir Jr — Obras originais</title>
  <meta name="description" content="Obras originais do artista plástico e tatuador Valmir Jr, de Belo Horizonte. Compre direto com o artista pelo WhatsApp.">
  <meta name="theme-color" content="#f6f4f0">
  <meta property="og:title" content="Valmir Jr — Obras originais">
  <meta property="og:description" content="Obras originais à venda. Compre direto com o artista pelo WhatsApp.">
  <meta property="og:type" content="website">
  <link rel="icon" href="/images/site/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/images/site/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topo">
    <a href="#obras" class="marca" data-nome>Valmir Jr</a>
    <nav class="nav" aria-label="Principal">
      <a href="#obras">Obras</a>
      <a href="#sobre">Sobre</a>
      <a href="#contato">Contato</a>
    </nav>
  </header>

  <main>
    <section id="obras" class="obras">
      <div class="obras-cab">
        <h1 class="titulo">Originais</h1>
        <div class="filtros" role="tablist" aria-label="Filtrar obras">
          <button class="filtro ativo" data-filtro="todas" role="tab" aria-selected="true">Todas</button>
          <button class="filtro" data-filtro="disponivel" role="tab" aria-selected="false">Disponíveis</button>
          <button class="filtro" data-filtro="vendida" role="tab" aria-selected="false">Vendidas</button>
        </div>
      </div>
      <ul class="grade" id="grade" aria-live="polite"></ul>
      <p class="vazio" id="vazio" hidden>Nenhuma obra por aqui ainda.</p>
      <p class="aviso" data-aviso></p>
    </section>

    <section id="sobre" class="sobre">
      <figure class="sobre-foto"><img data-foto alt="Retrato de Valmir Jr" loading="lazy" width="1100" height="1308"></figure>
      <div class="sobre-texto">
        <h2 class="titulo">Sobre</h2>
        <p class="subtitulo" data-subtitulo></p>
        <div class="bio" data-bio></div>
      </div>
    </section>

    <section id="contato" class="contato">
      <h2 class="titulo">Contato</h2>
      <p>Encomendas, dúvidas ou visitas ao ateliê:</p>
      <div class="contato-links">
        <a class="botao botao-wpp" data-wpp-geral target="_blank" rel="noopener">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2l-.5-.3Z"/></svg>
          Conversar no WhatsApp
        </a>
        <a class="botao botao-linha" data-insta target="_blank" rel="noopener">Instagram</a>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <span>© <span data-ano></span> <span data-nome>Valmir Jr</span></span>
    <span>Belo Horizonte · MG</span>
  </footer>

  <!-- Detalhe da obra -->
  <dialog class="detalhe" id="detalhe" aria-labelledby="detalhe-titulo">
    <button class="fechar" data-fechar aria-label="Fechar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
    <div class="detalhe-corpo">
      <div class="galeria" id="galeria"></div>
      <div class="pontos" id="pontos"></div>
      <div class="detalhe-info">
        <h2 id="detalhe-titulo" class="detalhe-titulo"></h2>
        <p class="detalhe-preco" id="detalhe-preco"></p>
        <dl class="ficha" id="ficha"></dl>
        <p class="detalhe-desc" id="detalhe-desc"></p>
        <a class="botao botao-wpp botao-cheio" id="comprar" target="_blank" rel="noopener"></a>
        <p class="detalhe-nota" data-aviso></p>
      </div>
    </div>
  </dialog>

  <script src="/app.js" defer></script>
</body>
</html>
